name: Release

on:
  push:
    branches:
      - "master"
      - "personal"
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.1"
  DART_VERSION: "3.9.0"
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"
  WEB_BASE_HREF: "/OASX/"

jobs:
  warm_flutter_cache:
    name: Warm Flutter Cache (${{ matrix.label }})
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
          - label: Windows
            os: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Warm pub cache
        if: steps.flutter-action.outputs.PUB-CACHE-HIT != 'true'
        shell: bash
        run: flutter pub get

      - name: Report Flutter cache status
        shell: bash
        run: |
          echo "Flutter cache key: ${{ steps.flutter-action.outputs.CACHE-KEY }}"
          echo "Flutter cache hit: ${{ steps.flutter-action.outputs.CACHE-HIT }}"
          echo "Pub cache key: ${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}"
          echo "Pub cache hit: ${{ steps.flutter-action.outputs.PUB-CACHE-HIT }}"

      - name: Check click trace and updater UI
        if: matrix.label == 'Linux'
        shell: bash
        run: |
          flutter test test/click_trace_models_test.dart
          flutter test test/oas_source_config_test.dart
          flutter analyze lib/modules/home/models/click_trace_models.dart lib/modules/home/widgets/click_trace_panel.dart lib/modules/home/widgets/active_config_panel.dart lib/modules/home/widgets/workbench_sidebar_panel.dart lib/modules/home/controllers/dashboard_controller.dart lib/service/app_update_service.dart lib/service/app_update/app_version_utils.dart lib/service/app_update/installers/windows_update_installer.dart lib/translation/i18n_content.dart lib/translation/cn_parts/cn_ui.dart lib/translation/i18n_us.dart
          flutter analyze lib/main.dart lib/config/theme.dart lib/service/appearance_service.dart lib/service/oas_source_service.dart lib/service/window_service.dart lib/service/window_service_restart.dart lib/modules/common/widgets/app_background.dart lib/modules/common/widgets/glass_panel.dart lib/modules/home/index.dart lib/modules/home/widgets/oas_source_dialog.dart lib/modules/home/widgets/config_collection_panel.dart lib/modules/home/widgets/config_collection_tile.dart lib/modules/home/widgets/task_status_row.dart lib/modules/home/widgets/task_status_swipe_container.dart lib/modules/home/widgets/task_catalog_panel.dart lib/modules/settings/appearance_card.dart lib/modules/settings/settings_view.dart lib/modules/settings/widgets/setting_card.dart lib/modules/server/models/oas_source_config.dart lib/modules/server/controllers/server_controller.dart

      - name: Build Windows test package
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          ./launcher/Test-ApplyUpdate.ps1
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows build failed.' }
          ./launcher/Package-Windows.ps1 -Channel test -Version "${{ github.sha }}"

      - name: Upload Windows test package
        if: matrix.label == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: oasx-master-test-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 7

  create_release:
    name: Create Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          version_core="${tag_name#v}"
          build_name="${version_core%%+*}"
          build_number="1"
          prerelease="false"

          if [[ "$tag_name" == *-* ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
            prerelease="true"
          fi

          {
            echo "tag_name=$tag_name"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "version=$build_name+$build_number"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Extract latest changelog
        shell: bash
        run: python ./script/extract_changelog.py

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            exit 0
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG_NAME" \
              --notes-file CHANGELATEST.md \
              --prerelease
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $TAG_NAME" \
              --notes-file CHANGELATEST.md
          fi

  build_windows:
    name: Build Windows
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2022
    needs: create_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: pwsh
        run: |
          $flutterOutput = ((flutter --version) | Out-String).Trim()
          $flutterOutput
          if ($flutterOutput -notmatch "Flutter $env:FLUTTER_VERSION") {
            throw "Expected Flutter $env:FLUTTER_VERSION"
          }

          $dartOutput = ((dart --version 2>&1) | Out-String).Trim()
          $dartOutput
          if ($dartOutput -notmatch "Dart SDK version: $env:DART_VERSION") {
            throw "Expected Dart $env:DART_VERSION"
          }

      - name: Restore Windows release file
        env:
          WINDOWS_RELEASE_PATH: ${{ secrets.WINDOWS_PATH_KEY }}
          WINDOWS_RELEASE_CONTENT: ${{ secrets.WINDOWS_PATH_VALUES }}
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_PATH) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_RELEASE_CONTENT)
          ) {
            Write-Host 'Skip restoring Windows release file because required secrets are empty.'
            exit 0
          }

          $path = $env:WINDOWS_RELEASE_PATH
          $directory = Split-Path -Path $path -Parent
          if (![string]::IsNullOrWhiteSpace($directory)) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          Set-Content -Path $path -Value $env:WINDOWS_RELEASE_CONTENT -Encoding UTF8

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows app
        shell: pwsh
        run: |
          ./launcher/Test-ApplyUpdate.ps1
          flutter build windows --release `
            --build-name "${{ needs.create_release.outputs.build_name }}" `
            --build-number "${{ needs.create_release.outputs.build_number }}"

      - name: Install UPX
        shell: pwsh
        run: choco install upx -y

      - name: Compress Windows binaries
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          Push-Location $releasePath
          try {
            Get-ChildItem -Filter *.exe | ForEach-Object { & upx --best --lzma $_.Name }
            Get-ChildItem -Filter *.dll | ForEach-Object { & upx --best --lzma $_.Name }
          } finally {
            Pop-Location
          }

      - name: Add startup launcher to Windows release
        shell: pwsh
        run: |
          ./launcher/Package-Windows.ps1 -Channel stable `
            -Version "${{ needs.create_release.outputs.tag_name }}"

      - name: Package Windows release
        id: package
        shell: pwsh
        run: |
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          $assetName = "oasx_${{ needs.create_release.outputs.tag_name }}_windows.zip"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          if (Test-Path $assetPath) {
            Remove-Item $assetPath -Force
          }
          Compress-Archive -Path (Join-Path $releasePath '*') -DestinationPath $assetPath
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ needs.create_release.outputs.tag_name }}" `
            "${{ steps.package.outputs.asset_path }}" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

  publish_personal_windows:
    name: Publish Personal Windows
    if: ${{ github.ref == 'refs/heads/personal' }}
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Build and package personal release
        id: package
        shell: pwsh
        run: |
          ./launcher/Test-ApplyUpdate.ps1
          $version = Get-Date -Format 'yyyy.M.d'
          $tag = "v$version.$env:GITHUB_RUN_NUMBER"
          flutter build windows --release `
            --build-name "$version" --build-number "$env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter Windows build failed.' }
          ./launcher/Package-Windows.ps1 -Channel stable -Version $tag
          $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          if (!(Test-Path $releasePath)) {
            $releasePath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/runner/Release'
          }
          $assetName = "oasx_${tag}_windows.zip"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          Compress-Archive -Path (Join-Path $releasePath '*') -DestinationPath $assetPath
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT

      - name: Publish personal release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.package.outputs.tag }}"
          if (-not (gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null)) {
            gh release create $tag `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "Personal OASX $tag" `
              --notes "OASX personal stable build from $env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create personal release.' }
          }
          gh release upload $tag "${{ steps.package.outputs.asset_path }}" `
            --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload personal release.' }

  build_android:
    name: Build Android
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Verify SDK versions
        shell: bash
        run: |
          flutter_output="$(flutter --version)"
          echo "$flutter_output"
          if [[ "$flutter_output" != *"Flutter ${FLUTTER_VERSION}"* ]]; then
            echo "Expected Flutter ${FLUTTER_VERSION}"
            exit 1
          fi

          dart_output="$(dart --version 2>&1)"
          echo "$dart_output"
          if [[ "$dart_output" != *"Dart SDK version: ${DART_VERSION}"* ]]; then
            echo "Expected Dart ${DART_VERSION}"
            exit 1
          fi

          java_output="$(java -version 2>&1 | head -n 1)"
          echo "$java_output"
          if [[ "$java_output" != *"\"${JAVA_VERSION}"* ]]; then
            echo "Expected Java ${JAVA_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Build split-per-abi APKs
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --target-platform android-arm,android-arm64 \
            --build-name "${{ needs.create_release.outputs.build_name }}" \
            --build-number "${{ needs.create_release.outputs.build_number }}"

      - name: Prepare Android release assets
        id: prepare_android_assets
        env:
          TAG_NAME: ${{ needs.create_release.outputs.tag_name }}
        shell: bash
        run: |
          release_dir="build/app/outputs/github-release"
          mkdir -p "$release_dir"

          cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
            "${release_dir}/oasx_${TAG_NAME}_armeabi-v7a.apk"
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
            "${release_dir}/oasx_${TAG_NAME}_arm64-v8a.apk"

          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Android assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ needs.create_release.outputs.tag_name }}
        shell: bash
        run: |
          assets=(
            "${{ steps.prepare_android_assets.outputs.release_dir }}/oasx_${TAG_NAME}_armeabi-v7a.apk"
            "${{ steps.prepare_android_assets.outputs.release_dir }}/oasx_${TAG_NAME}_arm64-v8a.apk"
          )

          for asset in "${assets[@]}"; do
            gh release upload "$TAG_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done

  build_web:
    name: Build Web
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: false

      - name: Verify SDK versions
        shell: bash
        run: |
          flutter_output="$(flutter --version)"
          echo "$flutter_output"
          if [[ "$flutter_output" != *"Flutter ${FLUTTER_VERSION}"* ]]; then
            echo "Expected Flutter ${FLUTTER_VERSION}"
            exit 1
          fi

          dart_output="$(dart --version 2>&1)"
          echo "$dart_output"
          if [[ "$dart_output" != *"Dart SDK version: ${DART_VERSION}"* ]]; then
            echo "Expected Dart ${DART_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Build web app
        shell: bash
        run: |
          flutter build web --release \
            --base-href "${{ env.WEB_BASE_HREF }}" \
            --build-name "${{ needs.create_release.outputs.build_name }}" \
            --build-number "${{ needs.create_release.outputs.build_number }}"

      - name: Deploy to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: page
          folder: build/web
